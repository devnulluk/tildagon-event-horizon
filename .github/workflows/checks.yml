name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Test choreography, native drawing and lifecycle
        run: python -m unittest discover -s tests
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Validate manifest and actual store archive
        run: python tools/validate_manifest.py --git-ref HEAD
